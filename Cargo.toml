[workspace]
members = [
  # keep-sorted start
  "batsat",
  "cadical",
  "capi",
  "codegen",
  "glucose",
  "ipasir",
  "kissat",
  "minisat",
  "pigeons",
  "pyapi",
  "solvertests",
  "tools",
  # keep-sorted end
]
resolver = "2"

[workspace.package]
version = "0.7.5"
license = "MIT"
edition = "2024"
rust-version = "1.87.0" # update the crate documentation if you change this

[workspace.dependencies]
# keep-sorted start block=yes
annotate-snippets = "0.12.3"
anyhow = "1.0.46"
bindgen = { version = ">=0.71, <=0.73", default-features = false, features = [
  "runtime",
] }
bzip2 = ">=0.4,<=0.6"
cc = { version = "1.0.83", features = ["parallel"] }
chacha20 = "0.10"
chrono = "0.4"
clap = { version = "4.3", features = ["derive", "cargo"] }
cmake = "0.1.44"
concolor-clap = "0.1"
cpu-time = "1"
flate2 = { version = "1.0.31", features = [
  "zlib-ng",
], default-features = false }
git2 = ">=0.14,<=0.21"
glob = "0.3"
gungraun = "0.20"
insta = { version = "1.36", features = ["yaml"] }
itertools = ">=0.5,<=0.15"
libtest-mimic = "0.8"
pigeons = { version = "0.2", path = "./pigeons" }
rand = "0.10"
rustc-hash = "2.1"
rustsat = { version = "0.7.5", path = "./", default-features = false }
rustsat-cadical = { version = "0.7.5", path = "./cadical" }
rustsat-minisat = { version = "0.7.5", path = "./minisat" }
rustsat-solvertests = { path = "./solvertests" }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.127"
signal-hook = ">=0.3,<=0.4"
tempfile = "3.1"
termcolor = "1.1.1"
thiserror = "2"
visibility = "0.1"
web-time = "1"
winnow = { version = "1", default-features = false, features = [
  "std",
  "ascii",
] }
xz2 = "0.1"
# keep-sorted end

[package]
name = "rustsat"
version.workspace = true
edition.workspace = true
authors = ["Christoph Jabs <christoph.jabs@helsinki.fi>"]
license.workspace = true
description = "This library aims to provide implementations of elements commonly used in the development on software in the area of satisfiability solving. The focus of the library is to provide as much ease of use without giving up on performance."
keywords = ["sat", "satisfiability", "encodings"]
repository = "https://github.com/chrjabs/rustsat"
readme = "README.md"
rust-version.workspace = true
include = [
  "LICENSE",
  "CHANGELOG.md",
  "README.md",
  "/src/",
  "/examples/",
  "/docs/",
]

[dependencies]
# keep-sorted start
annotate-snippets.workspace = true
anyhow.workspace = true
bzip2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
itertools.workspace = true
pigeons = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
visibility = { workspace = true, optional = true }
winnow.workspace = true
xz2 = { workspace = true, optional = true }
# keep-sorted end

[dev-dependencies]
# keep-sorted start
clap.workspace = true
concolor-clap.workspace = true
gungraun.workspace = true
insta.workspace = true
rustsat-minisat = { path = "./minisat" }
rustsat-solvertests.workspace = true
rustsat-tools = { path = "./tools" }
serde.workspace = true
serde_json.workspace = true
termcolor.workspace = true
# keep-sorted end

[target.'cfg(any(target_family = "unix", target_family = "windows"))'.dependencies]
cpu-time.workspace = true

[target.'cfg(not(any(target_family = "unix", target_family = "windows")))'.dependencies]
web-time.workspace = true

[features]
default = ["optimization", "fxhash"]
_internals = ["dep:visibility"]
fxhash = ["dep:rustc-hash"]
optimization = []
multiopt = ["optimization"]
compression = ["dep:bzip2", "dep:flate2", "dep:xz2"]
rand = ["dep:rand"]
ipasir-display = []
serde = ["dep:serde", "pigeons/serde"]
proof-logging = ["dep:pigeons"]
verbose-proofs = ["proof-logging"]
_bench = ["_internals"]
_docs = [
  # keep-sorted start
  "compression",
  "fxhash",
  "multiopt",
  "proof-logging",
  "rand",
  "serde",
  "verbose-proofs",
  # keep-sorted end
  "_internals",
]
_test = [
  # keep-sorted start
  "compression",
  "fxhash",
  "multiopt",
  "proof-logging",
  "rand",
  "serde",
  "verbose-proofs",
  # keep-sorted end
  "_internals",
]

[package.metadata.docs.rs]
features = ["_docs"]
rustdoc-args = ["--cfg", "docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[[example]]
name = "check-solution"
doc-scrape-examples = true
required-features = ["optimization", "multiopt"]

[[example]]
name = "cnf2opb"
doc-scrape-examples = true

[[example]]
name = "gbmosplit"
doc-scrape-examples = true
required-features = ["optimization"]

[[example]]
name = "mcnf2opb"
doc-scrape-examples = true
required-features = ["multiopt"]

[[example]]
name = "opb2cnf"
doc-scrape-examples = true

[[example]]
name = "opb2mcnf"
doc-scrape-examples = true
required-features = ["multiopt"]

[[example]]
name = "opb2wcnf"
doc-scrape-examples = true
required-features = ["optimization"]

[[example]]
name = "profiling"
doc-scrape-examples = true

[[example]]
name = "print-lits"
doc-scrape-examples = true

[[example]]
name = "shuffledimacs"
doc-scrape-examples = true
required-features = ["optimization", "multiopt"]

[[example]]
name = "wcnf2opb"
doc-scrape-examples = true
required-features = ["optimization"]

[[bench]]
name = "construct_trees"
harness = false

[[bench]]
name = "parsers"
harness = false
required-features = ["optimization", "multiopt"]

[profile.profiling]
inherits = "release"
debug = 1

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
